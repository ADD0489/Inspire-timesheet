<!DOCTYPE html>
<html lang="en-NZ">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; color: #1d2433; margin: 0; padding: 32px 20px; }
  .card { max-width: 440px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 16px; line-height: 1.5; margin: 0; color: #3b4456; }
  .brand { font-size: 13px; color: #6b7385; margin-bottom: 14px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Inspire Kitchens</div>
    <h1><?= title ?></h1>
    <p><?= body ?></p>
  </div>
</body>
</html>
